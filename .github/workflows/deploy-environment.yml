name: Deploy roster API environment

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      parameter_file: { required: true, type: string }
      expected_environment: { required: true, type: string }
      expected_masking: { required: true, type: string }
      version: { required: true, type: string }
      commit: { required: true, type: string }
      built_utc: { required: true, type: string }
      digest: { required: true, type: string }
      artifact_name: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard deployment target
        run: bash ./scripts/guard-target.sh "${{ vars.AZURE_RESOURCE_GROUP }}"
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
      - name: Verify promoted artifact
        run: |
          echo "${{ inputs.digest }}  roster-api.zip" | sha256sum --check -
          mkdir -p dist && unzip -q roster-api.zip -d dist
      - name: Deploy infrastructure and configuration
        id: infra
        run: |
          set -euo pipefail
          out=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "roster-${{ inputs.environment }}-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters @${{ inputs.parameter_file }} \
            --parameters appVersion='${{ inputs.version }}' \
                         gitCommit='${{ inputs.commit }}' \
                         buildUtc='${{ inputs.built_utc }}' \
            --query properties.outputs -o json)
          app=$(echo "$out" | jq -r .functionAppName.value)
          url=$(echo "$out" | jq -r .functionAppUrl.value)
          bash ./scripts/guard-target.sh "${{ vars.AZURE_RESOURCE_GROUP }}" "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.app }}
          package: dist
          remote-build: true
      - name: Post-deployment smoke test
        run: bash ./scripts/smoke-test.sh "${{ steps.infra.outputs.url }}" "${{ inputs.commit }}" "${{ inputs.expected_environment }}" "${{ inputs.expected_masking }}"
      - name: Write audit evidence
        run: |
          echo "## Roster API deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ inputs.commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact SHA-256: ${{ inputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Initiated by: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
