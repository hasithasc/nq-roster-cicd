name: Promote roster API

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit SHA or release tag to promote
        required: true
        default: main

permissions:
  id-token: write
  contents: write

concurrency:
  group: promote-roster-api
  cancel-in-progress: false

env:
  APP_PATH: src/roster_api

jobs:
  build:
    name: Build, test and package once
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      commit_full: ${{ steps.meta.outputs.commit_full }}
      builtUtc: ${{ steps.meta.outputs.builtUtc }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ${{ env.APP_PATH }}/requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest
      - run: bash ./scripts/check-isolation.sh
      - name: Capture immutable release identity
        id: meta
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "builtUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Package application
        id: package
        run: |
          mkdir -p dist
          cp -r ${{ env.APP_PATH }}/. dist/
          (cd dist && zip -qr ../roster-api.zip .)
          digest=$(sha256sum roster-api.zip | cut -d' ' -f1)
          echo "$digest  roster-api.zip" > roster-api.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: roster-api-${{ github.run_id }}
          path: |
            roster-api.zip
            roster-api.sha256
          retention-days: 30

  deploy-dev:
    name: Deploy Development
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: development
      parameter_file: infra/dev.parameters.json
      expected_environment: Development
      expected_masking: 'false'
      version: ${{ needs.build.outputs.version }}
      commit: ${{ needs.build.outputs.commit }}
      built_utc: ${{ needs.build.outputs.builtUtc }}
      digest: ${{ needs.build.outputs.digest }}
      artifact_name: roster-api-${{ github.run_id }}
    secrets: inherit

  deploy-test:
    name: Promote to Test/UAT
    needs: [build, deploy-dev]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
      parameter_file: infra/test.parameters.json
      expected_environment: Test/UAT
      expected_masking: 'true'
      version: ${{ needs.build.outputs.version }}
      commit: ${{ needs.build.outputs.commit }}
      built_utc: ${{ needs.build.outputs.builtUtc }}
      digest: ${{ needs.build.outputs.digest }}
      artifact_name: roster-api-${{ github.run_id }}
    secrets: inherit

  tag-test-release:
    name: Tag successful Test/UAT release
    needs: [build, deploy-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_full }}
          fetch-depth: 0
      - name: Create immutable Test/UAT tag
        env:
          TAG: rc-v${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit_full }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tagged_commit=$(git rev-list -n 1 "$TAG")
            [[ "$tagged_commit" == "$COMMIT" ]] || {
              echo "Tag $TAG already points to a different commit. Refusing to overwrite it."
              exit 1
            }
            echo "Tag $TAG already exists on the deployed commit."
          else
            git tag -a "$TAG" "$COMMIT" -m "Roster API Test/UAT release $TAG"
            git push origin "$TAG"
          fi
          echo "### Test/UAT release tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test/UAT deployment and smoke test: passed" >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Promote to Production
    needs: [build, tag-test-release]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      parameter_file: infra/prod.parameters.json
      expected_environment: Production
      expected_masking: 'true'
      version: ${{ needs.build.outputs.version }}
      commit: ${{ needs.build.outputs.commit }}
      built_utc: ${{ needs.build.outputs.builtUtc }}
      digest: ${{ needs.build.outputs.digest }}
      artifact_name: roster-api-${{ github.run_id }}
    secrets: inherit

  tag-production-release:
    name: Tag successful Production release
    needs: [build, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_full }}
          fetch-depth: 0
      - name: Create immutable Production tag and GitHub Release
        env:
          TAG: v${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit_full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tagged_commit=$(git rev-list -n 1 "$TAG")
            [[ "$tagged_commit" == "$COMMIT" ]] || {
              echo "Tag $TAG already points to a different commit. Refusing to overwrite it."
              exit 1
            }
            echo "Tag $TAG already exists on the deployed commit."
          else
            git tag -a "$TAG" "$COMMIT" -m "Roster API Production release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --title "Roster API $TAG"
          fi
          echo "### Production release tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production deployment and smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
