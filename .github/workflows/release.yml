name: Create roster API release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 1.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r src/roster_api/requirements.txt pytest ruff
      - run: ruff check . && pytest && bash scripts/check-isolation.sh
      - name: Tag the approved main commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use x.y.z format"; exit 1; }
          git tag -a "v$VERSION" -m "Roster API release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "Roster API v$VERSION"

